<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Skripsi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <div class="container py-3 py-md-5">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">
            <h3 class="mb-4 text-center">📤 Upload Skripsi</h3>
            <!-- arahkan ke route hasil -->
            <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" class="form-mobile">
              <div class="mb-3">
                <label for="skripsi1" class="form-label">Upload Skripsi 1</label>
                <input type="file" name="skripsi1" id="skripsi1" accept=".pdf,.docx" class="form-control" required>
                <div class="form-text">Format yang didukung: PDF, DOCX</div>
              </div>
              <div class="mb-4">
                <label for="skripsi2" class="form-label">Upload Skripsi 2</label>
                <input type="file" name="skripsi2" id="skripsi2" accept=".pdf,.docx" class="form-control" required>
                <div class="form-text">Format yang didukung: PDF, DOCX</div>
              </div>
              <button type="submit" class="btn btn-success w-100 mb-3">
                📤 Upload dan Analisis
              </button>
            </form>
            <div class="text-center">
              <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                ⬅️ Kembali ke Dashboard
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
