<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload Skripsi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <div class="card shadow-lg col-md-6 mx-auto">
      <div class="card-body">
        <h3 class="mb-3 text-center">Upload Skripsi</h3>
        <!-- arahkan ke route hasil -->
        <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="skripsi1" class="form-label">Upload Skripsi 1</label>
            <input type="file" name="skripsi1" id="skripsi1" accept=".pdf,.docx" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="skripsi2" class="form-label">Upload Skripsi 2</label>
            <input type="file" name="skripsi2" id="skripsi2" accept=".pdf,.docx" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Upload</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Kembali ke Dashboard</a>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
